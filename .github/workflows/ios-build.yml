name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Pods
        working-directory: ios/App
        run: pod install

      - name: Build iOS Simulator
        working-directory: ios/App
        run: >
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath build
          build

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: for-us-ios-simulator-build
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app

  build-signed-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Pods
        working-directory: ios/App
        run: pod install

      - name: Check signing secrets
        env:
          IOS_SIGNING_CERT_BASE64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_SIGNING_PASSWORD: ${{ secrets.IOS_SIGNING_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -z "$IOS_SIGNING_CERT_BASE64" ] || [ -z "$IOS_PROFILE_BASE64" ] || [ -z "$IOS_SIGNING_PASSWORD" ] || [ -z "$IOS_TEAM_ID" ]; then
            echo "Missing iOS signing secrets. Skipping signed release build."
            exit 1
          fi

      - name: Import signing certificate
        env:
          IOS_SIGNING_CERT_BASE64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
          IOS_SIGNING_PASSWORD: ${{ secrets.IOS_SIGNING_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/ios-signing-cert.p12
          echo "$IOS_SIGNING_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" build.keychain
          security import "$CERT_PATH" -k ~/Library/Keychains/build.keychain -P "$IOS_SIGNING_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain

      - name: Install provisioning profile
        env:
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/for-us.mobileprovision
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Create export options
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > ios/App/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive app
        working-directory: ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: >
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -configuration Release
          -archivePath build/ForUs.xcarchive
          DEVELOPMENT_TEAM=$IOS_TEAM_ID
          CODE_SIGN_STYLE=Automatic
          archive

      - name: Export IPA
        working-directory: ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: >
          xcodebuild
          -exportArchive
          -archivePath build/ForUs.xcarchive
          -exportOptionsPlist exportOptions.plist
          -exportPath build/export

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: for-us-ios-release
          path: ios/App/build/export/*.ipa
